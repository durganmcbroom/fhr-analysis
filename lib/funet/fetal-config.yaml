model:
  channels: 5
  dilations: [1, 1, 1]
  bottleneck_dilation: 1
  bottleneck_convs: 2
  codec_convolutions: 3   # conv-norm-relu blocks per encoder AND per decoder level (default 3)
  base_channels: 12
  dropout: 0.0
  # Spectrogram geometry: part of the model's input contract, so a checkpoint is only
  # loadable alongside these.
  n_fft: 1024
  hop_length: 256

train:
  optimizer: 'AdamW'   # SGD, Adam, AdamW
  learning_rate: 3.e-4
  weight_decay: 0.2
  batch_size: 8
  epochs: 80
  crop_len: 7
  clip: 5.0             # max gradient norm
  loss: 'mse'   # 'kldiv' | 'snr' | 'corr' | 'corr_amp' (corr + d' peak-contrast) | 'mse' (unit-peak comb)
  lr_schedule: 'plateau'  # 'none' (constant LR) | 'cosine' (anneal learning_rate -> min_lr) | 'plateau' (ssnet-style)
  min_lr: 1.e-5         # cosine floor only; unused by 'none' and 'plateau'
  plateau_factor: 0.5      # plateau: multiply LR by this on each reduction (ssnet used 0.5)
  plateau_patience: 3      # plateau: epochs with no val improvement before reducing (ssnet used 3)
  # corr_amp only (ignored by other losses): d' rewards beats standing clear of a quiet floor.
  amp_weight: 0.1           # weight on the d' peak-contrast term; 0 = pure correlation (try 0.01-0.1)
  amp_beat_threshold: 0.1   # frac of per-item target peak above which a frame counts as a beat
  # Regularisation (train-only).
  augment: ['channel_dropout', 'gain', 'noise']
  # SpecAugment-style masks, max width of one zeroed band per sample; 0 = off.
  freq_mask: 0   # freq bins (of 512 kept); try ~40
  time_mask: 0   # time frames; keep < one beat interval (~6 frames at hop 256 / 4kHz), try 4-6

data:
  train_dir: 'training/stereo_v7/fetal-train'
  val_dir: 'training/stereo_v7/fetal-test'   # held-out patient; selects model_best.pt
  num_workers: 8
  # Deterministic input transforms, applied to BOTH splits and at inference (unlike
  # train.augment, which is random and train-only). 'bandpass' = 100-300 Hz butterworth,
  # 'normalize' = peak to +/-1. Changing this invalidates a checkpoint -- leave it empty to
  # stay compatible with the existing funet-v33 weights.
  preprocess: ["bandpass", "normalize"]

model_dir: 'models/funet-v34/'
