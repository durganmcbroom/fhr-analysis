model:
  channels: 5
  dilations:
  - 1
  - 2
  - 2
  - 4
  bottleneck_dilation: 1
  bottleneck_convs: 3
  base_channels: 16
  dropout: 0.2
  n_fft: 1024
  hop_length: 256
train:
  optimizer: AdamW
  learning_rate: 0.0003
  weight_decay: 0.2
  batch_size: 8
  epochs: 80
  crop_len: 7
  loss: corr
  lr_schedule: cosine
  min_lr: 1.0e-05
  augment:
  - channel_dropout
  - gain
  - noise
  freq_mask: 0
  time_mask: 0
data:
  train_dir: training/stereo_v7/fetal-train
  val_dir: training/stereo_v7/fetal-test
  num_workers: 8
model_dir: models/funet-v15/
