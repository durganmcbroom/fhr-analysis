model:
  channels: 3
  dilations:
  - 1
  - 1
  - 1
  bottleneck_dilation: 1
  bottleneck_convs: 2
  codec_convolutions: 3
  base_channels: 12
  dropout: 0.0
  n_fft: 1024
  hop_length: 256
  interpolation: linear
  freq_crop_hz:
  - 80
  - 350
  disable_freq_crop: false
  padding_mode: reflect
train:
  optimizer: AdamW
  learning_rate: 0.0003
  weight_decay: 0.2
  batch_size: 8
  epochs: 80
  crop_len: 7
  clip: 5.0
  loss: mse
  lr_schedule: plateau
  min_lr: 1.0e-05
  plateau_factor: 0.5
  plateau_patience: 3
  measure_hr: true
  amp_weight: 0.1
  amp_beat_threshold: 0.1
  augment:
  - channel_dropout
  - gain
  - noise
  freq_mask: 0
  time_mask: 0
data:
  train_dir: training/stereo_v13/fetal-train
  val_dir: training/stereo_v13/fetal-test
  num_workers: 8
  preprocess:
  - bandpass
  - normalize
model_dir: models/funet-v38/
