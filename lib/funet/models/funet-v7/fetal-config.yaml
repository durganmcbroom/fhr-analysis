model:
  channels: 5
  dilations:
  - 1
  - 1
  - 2
  - 4
  bottleneck_dilation: 1
  bottleneck_convs: 3
  base_channels: 16
  n_fft: 1024
  hop_length: 256
train:
  optimizer: AdamW
  learning_rate: 0.0003
  weight_decay: 0.1
  batch_size: 8
  epochs: 80
  crop_len: 7
  loss: corr
  augment:
  - channel_dropout
  - gain
  - noise
data:
  train_dir: training/stereo_v2/fetal-train
  val_dir: training/stereo_v2/fetal-test
  num_workers: 8
model_dir: models/funet-v7/
