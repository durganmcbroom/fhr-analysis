model:
  channels: 3          # abdomen fibers; training_clips.yaml stacks 1B / 2A / 2B, in that order

  # The AudioSet checkpoint (nicofarr/panns_ResNet22, pinned by revision) is not a config
  # field -- see palnet.model.CHECKPOINT. There is one checkpoint; a different one is a
  # different study. Fetched to the Hugging Face cache on first run (~259 MB), then reused.
  pretrained: true     # false = the random-weights control; see control-config-s0.yaml
  backbone_seed: 0     # ignored when pretrained

  # Where framewise embeddings are read off the trunk. 'after1' is PANNs' own 2048-d embedding
  # and the most semantic point in the network; 'layer4' (512-d) and 'layer3' (256-d) are
  # shallower and often the more transferable features. Time resolution is identical at all
  # three -- the trunk's pools are frequency-only.
  feature_layer: 'after1'

  # --- the front-end, matching funet-v36 on purpose ---
  # PALNet exists to test the backbone, and that is only answerable if it and FUNet are fed the
  # identical tensor. At n_fft 1024 a row is 3.906 Hz, so [80, 350] keeps 71 rows, which the
  # trunk's five frequency halvings floor to exactly 64 spanning 78.1-328.1 Hz.
  n_fft: 1024
  hop_length: 256          # 64 ms frames, and the target's bin width
  freq_crop_hz: null

  head_hidden: 256
  # Linear layers in the head. 1 = a plain linear probe (head_hidden then unused), the standard
  # baseline for a frozen backbone and the most informative first run; 3 = in -> hidden ->
  # hidden -> out.
  head_layers: 1
  dropout: 0.0
  interpolation: 'linear'   # 'linear' | 'pchip'; how frames are filled back onto the samples

train:
  optimizer: 'AdamW'   # SGD, Adam, AdamW
  learning_rate: 1.e-3  # higher than FUNet's: this mostly fits a head over frozen features
  weight_decay: 0.1
  batch_size: 8
  epochs: 60
  crop_len: 7           # seconds; 110 frames at hop 256
  clip: 5.0             # max gradient norm
  loss: 'mse'   # 'snr' | 'corr' | 'corr_amp' (corr + d' peak-contrast) | 'mse' (unit-peak comb)
  lr_schedule: 'cosine'  # 'none' (constant LR) | 'cosine' (anneal to min_lr) | 'plateau'
  min_lr: 1.e-5         # cosine floor only; unused by 'none' and 'plateau'
  plateau_factor: 0.5
  plateau_patience: 3
  # corr_amp only (ignored by other losses): d' rewards beats standing clear of a quiet floor.
  amp_weight: 0.1
  amp_beat_threshold: 0.1
  # Regularisation (train-only). Applied at 4 kHz, before preprocess.
  augment: ['channel_dropout', 'gain', 'noise']
  # SpecAugment-style masks, max width of one zeroed band per sample; 0 = off. Reachable at all
  # only because PALNet owns its spectrogram now.
  freq_mask: 0   # freq rows (of the 64 kept); try ~8
  time_mask: 0   # time frames; keep under one beat interval (~6 at hop 256), try 4-6

data:
  # Written by ./generate_training_snippets.sh from training_clips.yaml (FUNet's, unchanged),
  # which routes whole patients to fetal-train/ or fetal-test/ by their `mode`. Paths resolve
  # relative to this file, not the working directory.
  train_dir: 'training/stereo_v1/fetal-train'
  val_dir: 'training/stereo_v1/fetal-test'   # held-out patient; selects model_best.pt
  num_workers: 8
  # Load-bearing. freq_crop_hz drops the rows outside the band, but nothing has attenuated
  # maternal sound or motion *inside* it, and the crop was measured on a bandpassed mix.
  preprocess: ['bandpass', 'normalize']

model_dir: 'models/palnet-v4/'
