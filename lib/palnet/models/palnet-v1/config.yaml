model:
  channels: 3
  checkpoint: nicofarr/panns_ResNet22
  revision: e65b0662a88535d12289767b0bc1dbdfcc7523dc
  channel_mode: per_fiber
  feature_layer: after1
  freeze: all
  bn_recalibrate: false
  bn0_trainable: false
  model_hz: 8000
  hop: 8
  n_fft: 1024
  mel_bins: 64
  head_hidden: 256
  head_layers: 3
  dropout: 0.0
  interpolation: linear
train:
  optimizer: AdamW
  learning_rate: 0.001
  weight_decay: 0.1
  batch_size: 8
  epochs: 60
  crop_len: 4.096
  clip: 5.0
  loss: mse
  lr_schedule: cosine
  min_lr: 1.0e-05
  plateau_factor: 0.5
  plateau_patience: 3
  amp_weight: 0.1
  amp_beat_threshold: 0.1
  augment:
  - channel_dropout
  - gain
  - noise
data:
  train_dir: training/stereo_v1/fetal-train
  val_dir: training/stereo_v1/fetal-test
  num_workers: 8
  preprocess:
  - normalize
model_dir: models/palnet-v1/
