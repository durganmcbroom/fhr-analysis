model:
  channels: 3
  checkpoint: google/timesfm-2.0-500m-pytorch
  head_hidden: 256
  head_layers: 1
  dropout: 0.0
  context_length: 2048
  patch_length: 32
  n_fft: 128
  hop_length: 16
  band:
  - 100.0
  - 300.0
  log_envelope: true
train:
  optimizer: AdamW
  learning_rate: 0.001
  weight_decay: 0.1
  batch_size: 8
  epochs: 80
  crop_len: 7
  clip: 5.0
  loss: corr_amp
  lr_schedule: plateau
  min_lr: 1.0e-05
  plateau_factor: 0.5
  plateau_patience: 3
  amp_weight: 0.1
  amp_beat_threshold: 0.1
  augment:
  - channel_dropout
  - gain
  - noise
data:
  train_dir: training/stereo_v1/fetal-train
  val_dir: training/stereo_v1/fetal-test
  num_workers: 8
model_dir: models/tslnet-v1/
