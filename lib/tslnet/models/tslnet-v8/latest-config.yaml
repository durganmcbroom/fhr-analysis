model:
  channels: 3
  checkpoint: google/timesfm-2.0-500m-pytorch
  head_hidden: 256
  head_layers: 4
  dropout: 0.016590864758978672
  context_length: 2048
  patch_length: 32
  model_hz: 1000
train:
  optimizer: AdamW
  learning_rate: 0.0005029541938794264
  weight_decay: 0.01806830244726261
  batch_size: 8
  epochs: 50
  crop_len: 2.048
  clip: 5.0
  loss: mse
  lr_schedule: cosine
  min_lr: 4.127056310785443e-06
  plateau_factor: 0.5
  plateau_patience: 3
  amp_weight: 0.1
  amp_beat_threshold: 0.1
  augment:
  - channel_dropout
  - gain
  - noise
data:
  train_dir: training/stereo_v1/fetal-train
  val_dir: training/stereo_v1/fetal-test
  num_workers: 8
  preprocess:
  - bandpass
  - normalize
model_dir: models/tslnet-v8/
