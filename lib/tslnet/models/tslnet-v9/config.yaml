model:
  channels: 3
  checkpoint: google/timesfm-2.0-500m-pytorch
  head_hidden: 256
  head_layers: 2
  dropout: 0.0
  context_length: 2048
  patch_length: 32
  model_hz: 800
train:
  optimizer: AdamW
  learning_rate: 0.001
  weight_decay: 0.1
  batch_size: 8
  epochs: 50
  crop_len: 2.56
  clip: 5.0
  loss: mse
  lr_schedule: cosine
  min_lr: 1.0e-05
  plateau_factor: 0.5
  plateau_patience: 3
  amp_weight: 0.1
  amp_beat_threshold: 0.1
  augment:
  - channel_dropout
  - gain
  - noise
data:
  train_dir: training/stereo_v2/fetal-train
  val_dir: training/stereo_v2/fetal-test
  num_workers: 8
  preprocess:
  - bandpass
  - normalize
model_dir: models/tslnet-v9/
