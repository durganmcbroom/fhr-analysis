model:
  # number of input sources
  num_sources: 2
  stochastic: False

  # encoder/decoder parameters
  enc_kernel_size: 512
  enc_num_feats: 512
  enc_type: 'convolution'   # convolution, spectrogram, spectrogram2
  dec_type: 'convolution'   # convolution, group-convolution, spectrogram

  # conformer parameters
  msk_num_feats: 256
  msk_num_heads: 4
  msk_ffn_expand: 4
  msk_num_layers: 4
  msk_dropout: 0.3
  msk_individual_mask: True
  msk_type: 'transformer'   # conformer, transformer, transformer_relative

  msk_use_conv: True
  msk_kernel_size: 3
  msk_conv_layers: 6

  # wavelet analysis
  use_wavelet: False
  wavelet_scale: 8
  mother_wavelet: 'db10'

train:
  optimizer: 'AdamW'   # SGD, Adam, AdamW
  amsgrad: True        # neossnet's original Adam/AdamW behaviour
  learning_rate: 3.e-4
  weight_decay: 0.1
  batch_size: 8
  epochs: 80
  crop_len: 7    # time series in seconds
  clip: 5
  loss: 'SNR'    # SDR, LogMSE, SNR, SASDR, MSE
  weights: '1.0, 1.0'   # per-source loss weights, one per num_sources

  # scheduler: 'none' | 'cosine' (anneal learning_rate -> min_lr) | 'plateau'
  lr_schedule: 'plateau'
  min_lr: 1.e-5           # cosine floor only
  plateau_factor: 0.5
  plateau_patience: 3
  early_stop_patience: 3  # epochs without validation improvement before stopping

  augment: []   # subset of channel_dropout | gain | noise

data:
  train_dir: 'training/training_clips_mono_v10/fetal-train'
  val_fraction: 0.1   # tail of train_dir held out for validation
  num_workers: 4
  # Deterministic input transforms on the mix, applied to BOTH splits (unlike train.augment,
  # which is random and train-only). 'bandpass' = 100-300 Hz butterworth, 'normalize' = peak
  # to +/-1. Empty by default here: the targets are un-preprocessed source waveforms, so
  # band-limiting the mix asks the separator to reconstruct energy it can no longer see.
  preprocess: []

model_dir: 'models/tuned-model-v12/'
resume: '../neossnet/models/model_best.pt'
